[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-uav-atlas"
version = "1.0.0"
description = "Resumable pipeline that builds the Global UAV Visual Atlas 2026 from auditable sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
vision = ["anthropic>=0.40"]
detection = ["opencv-python>=4.8,<5", "numpy>=1.24", "Flask>=3.0"]
detection-edge = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-requests", "pypdf>=4.0"]

[project.scripts]
uav-atlas = "run:main"

[tool.setuptools]
packages = ["app", "agents", "crawlers", "detection"]

[tool.setuptools.package-data]
# The console template is loaded at runtime by Flask, so it must ship with
# the package rather than being treated as a stray non-Python file.
detection = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires outbound network access",
    "slow: long running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "output", "images", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # dataclass field defaults via factory are intentional
    "RUF012",  # mutable class attrs are fine for these config-style modules
    "SIM108",  # ternaries are not always clearer here
    "N806",    # ReportLab/PIL locals keep their upstream capitalisation
    "RUF001",  # en dashes and typographic quotes in atlas copy are deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802", "N801", "C408", "RUF059", "B007"]
"app/logging.py" = ["A005"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*", "PIL.*", "imagehash.*", "anthropic.*", "pypdf.*", "cv2.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true
