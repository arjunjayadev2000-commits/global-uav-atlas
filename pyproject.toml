[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-uav-atlas"
version = "1.0.0"
description = "Resumable pipeline that builds the Global UAV Visual Atlas 2026 from auditable sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
vision = ["anthropic>=0.40"]
# Desktop tracker application. The processing core runs without these.
gui = ["PyQt6>=6.5", "pyqtgraph>=0.13"]
# Live capture from an FMCOMMS5 / AD9361. Needs libiio on the host too.
sdr-hardware = ["pyadi-iio>=0.0.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-requests", "pypdf>=4.0"]

[project.scripts]
uav-atlas = "run:main"
uav-sdr-tracker = "sdr.gui.app:main"

[tool.setuptools]
packages = ["app", "agents", "crawlers", "sdr", "sdr.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires outbound network access",
    "slow: long running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "output", "images", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # dataclass field defaults via factory are intentional
    "RUF012",  # mutable class attrs are fine for these config-style modules
    "SIM108",  # ternaries are not always clearer here
    "N806",    # ReportLab/PIL locals keep their upstream capitalisation
    "RUF001",  # en dashes and typographic quotes in atlas copy are deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802", "N801", "C408", "RUF059", "B007", "E402"]
"app/logging.py" = ["A005"]
# Qt signals are camelCase by convention and Qt overrides are PascalCase;
# renaming them to satisfy pep8 would break the framework contract.
"sdr/gui/*" = ["N802", "N815"]
# IQSource.close() is an intentionally optional hook, not an unimplemented
# abstract method: most sources have nothing to release.
"sdr/sources.py" = ["B027"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*", "PIL.*", "imagehash.*", "anthropic.*", "pypdf.*"]
ignore_missing_imports = true
