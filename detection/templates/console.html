<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV-DET // TACTICAL CONSOLE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305080a'/%3E%3Cg fill='none' stroke='%233dfd8c' stroke-width='2.5'%3E%3Cpath d='M4 4h7M4 4v7M28 4h-7M28 4v7M4 28h7M4 28v-7M28 28h-7M28 28v-7'/%3E%3Ccircle cx='16' cy='16' r='4'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:        #05080a;
    --panel:     #0a1014;
    --panel-2:   #0d161b;
    --line:      #16323a;
    --line-hot:  #1e4a56;
    --green:     #3dfd8c;
    --green-dim: #1c7d49;
    --amber:     #ffb020;
    --red:       #ff3b46;
    --text:      #b9d6cf;
    --text-dim:  #587a74;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    /* Faint scanline texture over the whole console. */
    background-image: repeating-linear-gradient(
      0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,255,140,0.016) 3px, rgba(0,0,0,0) 4px);
    min-height: 100vh;
  }

  /* ---------- chrome ---------- */

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0b171c, #070d10);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b {
    color: var(--green); font-size: 16px; letter-spacing: 0.22em; font-weight: 700;
  }
  .brand span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.28em; }

  .header-spacer { flex: 1; }

  .stamp { color: var(--text-dim); font-size: 11px; letter-spacing: 0.12em; }
  .stamp b { color: var(--text); font-weight: 500; }

  /* ---------- threat banner ---------- */

  .threat {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 16px; border: 1px solid var(--line-hot);
    background: #081318; border-radius: 2px;
  }
  .threat .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 10px currentColor;
  }
  .threat .lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 0.24em; }
  .threat .val { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: var(--green); }

  .threat[data-level="GUARDED"]  { border-color: #4a5a1e; }
  .threat[data-level="GUARDED"]  .dot,
  .threat[data-level="GUARDED"]  .val { color: #cfe23a; background-color: #cfe23a; }
  .threat[data-level="GUARDED"]  .val { background: none; }

  .threat[data-level="ELEVATED"] { border-color: #6b4a12; background: #150f05; }
  .threat[data-level="ELEVATED"] .dot { background: var(--amber); }
  .threat[data-level="ELEVATED"] .val { color: var(--amber); }

  .threat[data-level="CRITICAL"] {
    border-color: #7a1b22; background: #17070a;
    animation: alarm 1.1s ease-in-out infinite;
  }
  .threat[data-level="CRITICAL"] .dot { background: var(--red); }
  .threat[data-level="CRITICAL"] .val { color: var(--red); }
  @keyframes alarm {
    0%,100% { box-shadow: 0 0 0 rgba(255,59,70,0); }
    50%     { box-shadow: 0 0 18px rgba(255,59,70,0.42); }
  }
  @media (prefers-reduced-motion: reduce) {
    .threat[data-level="CRITICAL"] { animation: none; }
  }

  /* ---------- layout ---------- */

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px; padding: 14px; align-items: start;
  }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 2px; position: relative;
  }
  /* Corner brackets on every panel — the recurring tactical motif. */
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none;
    border-color: var(--green-dim); border-style: solid;
  }
  .panel::before { top: -1px; left: -1px;  border-width: 1px 0 0 1px; }
  .panel::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .panel > h2 {
    margin: 0; padding: 8px 12px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.26em;
    color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; align-items: center; gap: 8px;
  }
  .panel > h2 .count {
    margin-left: auto; color: var(--green); letter-spacing: 0.1em;
  }

  /* ---------- feed ---------- */

  .feed-wrap { padding: 10px; }
  .feed-frame { position: relative; background: #000; border: 1px solid var(--line); }
  .feed-frame img { display: block; width: 100%; height: auto; }
  .feed-frame .corner {
    position: absolute; width: 18px; height: 18px;
    border-color: var(--green); border-style: solid; opacity: 0.75;
  }
  .c-tl { top: 6px;    left: 6px;  border-width: 2px 0 0 2px; }
  .c-tr { top: 6px;    right: 6px; border-width: 2px 2px 0 0; }
  .c-bl { bottom: 6px; left: 6px;  border-width: 0 0 2px 2px; }
  .c-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

  .feed-meta {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 9px 2px 2px; font-size: 11px; color: var(--text-dim);
  }
  .feed-meta b { color: var(--green); font-weight: 600; }

  .rec {
    display: inline-flex; align-items: center; gap: 6px; color: var(--red);
  }
  .rec i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--red);
    animation: blink 1.4s steps(2, start) infinite; font-style: normal;
  }
  @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0.15} }

  /* ---------- contacts table ---------- */

  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  thead th {
    text-align: left; padding: 6px 10px; font-weight: 500; font-size: 9.5px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 7px 10px; border-bottom: 1px solid #0e1a1f; }
  tbody tr.hostile { background: rgba(255,59,70,0.07); }
  tbody tr.hostile td:first-child { box-shadow: inset 2px 0 0 var(--red); }
  .tid { color: var(--text); font-weight: 600; }
  .cls-drone { color: var(--red); font-weight: 600; }
  .cls-bird  { color: var(--green); }
  .empty { padding: 22px 12px; text-align: center; color: var(--text-dim); font-size: 11px; }

  /* Confidence meter */
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .bar {
    flex: 1; height: 4px; background: #10222a; position: relative; overflow: hidden;
  }
  .meter .bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); }
  tr.hostile .meter .bar i { background: var(--red); }
  .meter span { font-variant-numeric: tabular-nums; color: var(--text-dim); min-width: 30px; }

  /* ---------- telemetry ---------- */

  .telem { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
  .telem div { background: var(--panel); padding: 9px 11px; }
  .telem dt { font-size: 9px; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; }
  .telem dd {
    margin: 3px 0 0; font-size: 15px; color: var(--green);
    font-variant-numeric: tabular-nums; letter-spacing: 0.06em;
  }

  /* ---------- event log ---------- */

  .log { max-height: 260px; overflow-y: auto; }
  .log ul { list-style: none; margin: 0; padding: 0; }
  .log li {
    display: grid; grid-template-columns: 62px 68px 1fr; gap: 8px;
    padding: 6px 10px; border-bottom: 1px solid #0e1a1f; font-size: 11px;
    align-items: baseline;
  }
  .log time { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .log .kind {
    font-size: 9px; letter-spacing: 0.14em; padding: 2px 5px; text-align: center;
    border: 1px solid currentColor; color: var(--text-dim); border-radius: 1px;
  }
  .log .kind[data-k="THREAT"] { color: var(--red); }
  .log .kind[data-k="CONTACT"] { color: var(--green); }
  .log .kind[data-k="LOST"]    { color: var(--amber); }
  .log .kind[data-k="FAULT"]   { color: var(--red); }
  .log .msg { color: var(--text); }

  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-track { background: #08110f; }
  .log::-webkit-scrollbar-thumb { background: #1b3b36; }

  .side { display: grid; gap: 14px; }

  footer {
    padding: 8px 18px; border-top: 1px solid var(--line);
    color: var(--text-dim); font-size: 10px; letter-spacing: 0.16em;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .link { color: var(--green-dim); text-decoration: none; }
  .link:hover { color: var(--green); }
  .offline { color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="brand"><b>UAV-DET</b><span>TACTICAL DETECTION CONSOLE</span></div>
  <div class="header-spacer"></div>
  <div class="threat" id="threat" data-level="CLEAR">
    <i class="dot"></i>
    <span class="lbl">THREAT</span>
    <span class="val" id="threat-val">CLEAR</span>
  </div>
  <div class="stamp">UTC <b id="clock">--:--:--</b></div>
</header>

<main>
  <section class="panel">
    <h2>Sensor Feed <span class="count" id="feed-mode">—</span></h2>
    <div class="feed-wrap">
      <div class="feed-frame">
        <img id="feed" src="/stream.mjpg" alt="Live detection feed">
        <span class="corner c-tl"></span><span class="corner c-tr"></span>
        <span class="corner c-bl"></span><span class="corner c-br"></span>
      </div>
      <div class="feed-meta">
        <span class="rec"><i></i>LIVE</span>
        <span>SRC <b id="m-src">—</b></span>
        <span>RATE <b id="m-fps">—</b> FPS</span>
        <span>FRAMES <b id="m-frames">—</b></span>
        <span>LINK <b id="m-link">—</b></span>
      </div>
    </div>
  </section>

  <div class="side">
    <section class="panel">
      <h2>Contacts <span class="count" id="c-count">00</span></h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Class</th><th>Brg</th><th>Conf</th></tr>
        </thead>
        <tbody id="contacts"></tbody>
      </table>
      <div class="empty" id="c-empty">NO CONTACTS — AIRSPACE CLEAR</div>
    </section>

    <section class="panel">
      <h2>Telemetry</h2>
      <dl class="telem">
        <div><dt>Uptime</dt><dd id="t-uptime">00:00:00</dd></div>
        <div><dt>Mode</dt><dd id="t-mode">—</dd></div>
        <div><dt>Hostile</dt><dd id="t-hostile">0</dd></div>
        <div><dt>Tracks Total</dt><dd id="t-tracks">0</dd></div>
      </dl>
    </section>

    <section class="panel">
      <h2>Event Log</h2>
      <div class="log"><ul id="events"></ul></div>
    </section>
  </div>
</main>

<footer>
  <span>UAV-DET v1.0</span>
  <span>YOLOv4 · OPENCV DNN</span>
  <span><a class="link" href="/api/state">/api/state</a></span>
  <span id="conn">LINK OK</span>
</footer>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  function fmtUptime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function tickClock() {
    const d = new Date();
    $("clock").textContent =
      `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  }
  setInterval(tickClock, 1000);
  tickClock();

  function renderContacts(contacts) {
    const tbody = $("contacts");
    $("c-count").textContent = pad(contacts.length);
    $("c-empty").style.display = contacts.length ? "none" : "block";

    tbody.replaceChildren(...contacts.map((c) => {
      const tr = document.createElement("tr");
      if (c.hostile) tr.className = "hostile";

      const id = document.createElement("td");
      id.className = "tid";
      id.textContent = String(c.id).padStart(3, "0");

      const cls = document.createElement("td");
      cls.className = c.label === "DRONE" ? "cls-drone" : "cls-bird";
      cls.textContent = c.label;

      const brg = document.createElement("td");
      brg.textContent = (c.bearing >= 0 ? "+" : "") + c.bearing.toFixed(1) + "°";

      const conf = document.createElement("td");
      const meter = document.createElement("div");
      meter.className = "meter";
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("i");
      fill.style.width = Math.round(c.confidence * 100) + "%";
      bar.appendChild(fill);
      const num = document.createElement("span");
      num.textContent = Math.round(c.confidence * 100) + "%";
      meter.append(bar, num);
      conf.appendChild(meter);

      tr.append(id, cls, brg, conf);
      return tr;
    }));
  }

  function renderEvents(events) {
    $("events").replaceChildren(...events.map((e) => {
      const li = document.createElement("li");
      const t = document.createElement("time");
      t.textContent = e.t;
      const k = document.createElement("span");
      k.className = "kind";
      k.dataset.k = e.kind;
      k.textContent = e.kind;
      const m = document.createElement("span");
      m.className = "msg";
      m.textContent = e.message;
      li.append(t, k, m);
      return li;
    }));
  }

  function apply(state) {
    const lvl = state.threat_level;
    $("threat").dataset.level = lvl;
    $("threat-val").textContent = lvl;

    renderContacts(state.contacts);
    renderEvents(state.events);

    const tm = state.telemetry;
    $("m-src").textContent = tm.source;
    $("m-fps").textContent = tm.fps.toFixed(1);
    $("m-frames").textContent = tm.frames;
    $("m-link").textContent = "OK";
    $("feed-mode").textContent = tm.mode;
    $("t-uptime").textContent = fmtUptime(tm.uptime);
    $("t-mode").textContent = tm.mode;
    $("t-hostile").textContent = state.hostile_count;
    $("t-tracks").textContent = tm.tracks_total;
  }

  async function poll() {
    try {
      const res = await fetch("/api/state", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      apply(await res.json());
      $("conn").textContent = "LINK OK";
      $("conn").classList.remove("offline");
    } catch (err) {
      $("conn").textContent = "LINK LOST";
      $("conn").classList.add("offline");
      $("m-link").textContent = "DOWN";
    }
  }

  poll();
  setInterval(poll, 500);
})();
</script>
</body>
</html>
