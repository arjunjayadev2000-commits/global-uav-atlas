services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: global-uav-atlas:latest
    container_name: global-uav-atlas
    # One-command startup: builds the whole atlas, resuming anything already done.
    command: ["--all", "--resume"]
    environment:
      # Secrets come from the shell or an .env file; never bake them into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UAV_VISION_ENABLED: ${UAV_VISION_ENABLED:-1}
      UAV_VISION_MODEL: ${UAV_VISION_MODEL:-claude-sonnet-5}
      UAV_LOG_LEVEL: ${UAV_LOG_LEVEL:-INFO}
      UAV_RATE_LIMIT_RPS: ${UAV_RATE_LIMIT_RPS:-1}
      UAV_RESPECT_ROBOTS: ${UAV_RESPECT_ROBOTS:-1}
      UAV_OFFLINE: ${UAV_OFFLINE:-0}
      UAV_DB_PATH: /app/data/uav_atlas.sqlite
    volumes:
      - atlas-data:/app/data
      - ./images:/app/images
      - ./output:/app/output
      - ./logs:/app/logs
      - ./docs:/app/docs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from app.db import connect, migrate, verify_schema; c=connect(); migrate(c); verify_schema(c)"
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 15s
    restart: "no"

  # Long-running variant: refreshes the atlas on a schedule inside the container.
  updater:
    extends:
      service: atlas
    container_name: global-uav-atlas-updater
    command: ["--update"]
    profiles: ["scheduled"]
    restart: unless-stopped

volumes:
  atlas-data:
    driver: local
