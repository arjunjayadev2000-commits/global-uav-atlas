name: weekly-discovery

on:
  schedule:
    # Sundays 03:17 UTC - off the hour to avoid the scheduler stampede.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      passes:
        description: "Number of discovery passes"
        required: false
        default: "3"
      skip_images:
        description: "Skip image acquisition"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Restore the previous run's database so discovery is incremental and the
      # HTTP cache is not re-fetched from scratch.
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/uav_atlas.sqlite
            data/cache
          key: atlas-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            atlas-state-${{ github.ref_name }}-

      - name: Run discovery update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UAV_LOG_LEVEL: INFO
          UAV_RATE_LIMIT_RPS: "0.5"
        run: |
          python run.py --update \
            --passes "${{ github.event.inputs.passes || '3' }}" \
            ${{ github.event.inputs.skip_images == 'true' && '--skip-images' || '' }}

      - name: Coverage summary
        run: |
          python run.py --stats --json > stats.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("stats.json"))
          print("## Weekly discovery\n")
          print(f"- Canonical platforms: **{s['canonical_platforms']}**")
          print(f"- Countries represented: **{s['countries_represented']}**")
          print(f"- Manufacturers: **{s['manufacturers']}**")
          print(f"- Images in atlas: **{s['images']['selected_for_atlas']}** "
                f"({s['images']['coverage_pct']}% coverage)")
          print(f"- Open unresolved items: **{s['unresolved_open']}**")
          PY

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/uav_atlas.sqlite
            data/cache
          key: atlas-state-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-logs-${{ github.run_id }}
          path: |
            logs/
            output/coverage_statistics.json
            output/unresolved_records.csv
          retention-days: 30
