name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # The suite must never touch the network; any attempt is a failure.
          UAV_OFFLINE: "1"
          UAV_LOG_LEVEL: WARNING
        run: pytest -q --cov=app --cov=agents --cov=crawlers --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Build the atlas offline from the seed package
        env:
          UAV_OFFLINE: "1"
        run: |
          python run.py --all --skip-images --passes 1
          python run.py --stop-conditions --json > stop-conditions.json
          cat stop-conditions.json

      - name: Assert the required outputs exist and are non-trivial
        run: |
          set -euo pipefail
          for f in \
            output/Global_UAV_Visual_Atlas_2026.pdf \
            output/Global_UAV_Visual_Atlas_2026.html \
            output/uav_database.csv \
            output/uav_database.xlsx \
            output/uav_database.sqlite \
            output/photo_attribution.csv \
            output/unresolved_records.csv \
            output/coverage_statistics.json \
            output/coverage_report.md \
            logs/audit.jsonl \
            logs/run.log
          do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done
          python - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader("output/Global_UAV_Visual_Atlas_2026.pdf")
          text = "".join((page.extract_text() or "") for page in reader.pages[:6])
          assert "Global UAV Visual Atlas 2026" in text, "PDF title text missing"
          assert "Country of Origin" in text, "PDF entry table missing"
          print(f"PDF ok: {len(reader.pages)} pages")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-smoke-outputs
          path: |
            output/
            logs/
          retention-days: 7
