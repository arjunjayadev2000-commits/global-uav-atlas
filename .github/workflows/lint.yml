name: lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy app agents crawlers run.py

      - name: Verify no secrets are committed
        run: |
          set -euo pipefail
          if [ -f .env ]; then echo ".env must never be committed"; exit 1; fi
          # Look for obvious key material in tracked files.
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}' -- . ; then
            echo "possible credential found in tracked files"
            exit 1
          fi
          echo "no credential patterns found"
