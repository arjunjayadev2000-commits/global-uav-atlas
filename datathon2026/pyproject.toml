[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsc-datathon2026"
version = "1.0.0"
description = "CDM Datathon 2026, Theme 6.2: conflict, AIS dark spots and maritime supply chains."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises the full pipeline against the real data files",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are the formatter's business
    "RUF012",  # config-style mutable class attributes are intentional
    "N803",    # X for a design matrix is the statistical convention
    "N806",
    "RUF001",  # typographic characters in report copy are deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]
